<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DHN — grafiche pronte</title>
<!-- 25/09/2026 · piano social FASE 1. Pagina di CONTROLLO del ramo `uscite`:
     serve a guardare le JPEG dal telefono. NON e' la galleria degli admin
     (quella e' la FASE 2, dentro admin.html). Legge solo file di GitHub Pages:
     zero richieste a Supabase. -->
<style>
 :root{--f:#0d0f14;--c:#161a22;--b:#262c38;--t:#eceef3;--g:#8d95a8;--prov:#f5a623;--uff:#2ecc71}
 *{box-sizing:border-box} body{margin:0;background:var(--f);color:var(--t);font:15px/1.45 system-ui,Segoe UI,sans-serif}
 header{padding:16px}
 h1{font-size:19px;margin:0} .g{color:var(--g);font-size:13px;margin:4px 0 0}
 section{margin:0 0 28px} h2{font-size:16px;margin:0;padding:12px 16px 4px}
 .bollo{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
 .provvisorio{background:var(--prov);color:#1b1200} .ufficiale{background:var(--uff);color:#032010}
 .altro{background:#444;color:#fff}
 .riga{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;padding:6px 16px}
 .riga a{display:block;position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:4/5}
 .riga img{width:100%;height:100%;object-fit:cover;display:block}
 .riga span{color:#fff;font-weight:600;position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 5px;background:linear-gradient(transparent,#000c)}
 dialog{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:12px;max-width:min(560px,96vw)}
 dialog img{width:100%;border-radius:6px} dialog pre{white-space:pre-wrap;font:13px/1.45 inherit;background:#0b0d12;padding:10px;border-radius:6px}
 dialog button{background:#2b3240;color:var(--t);border:0;border-radius:6px;padding:8px 12px;font:inherit;margin:6px 6px 0 0}
 .sc{color:var(--g);font-size:12px;padding:0 16px}
</style></head><body>
<header><h1>DHN — grafiche pronte</h1><p class="g" id="info">carico…</p></header>
<main id="m"></main>
<dialog id="d"><img id="di" alt=""><p class="g" id="dm"></p><pre id="dt"></pre>
<button id="copia">Copia didascalia</button><a id="dl" download><button>Scarica</button></a><button onclick="d.close()">Chiudi</button></dialog>
<script>
(async function () {
  var m = document.getElementById("m"), info = document.getElementById("info");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  try {
    var ind = await (await fetch("indice.json", { cache: "no-store" })).json();
    info.textContent = ind.gare.length + " gare · aggiornato " + new Date(ind.aggiornato).toLocaleString("it-IT");
    for (var i = 0; i < ind.gare.length; i++) {
      var g = ind.gare[i];
      var man = await (await fetch(g.cartella + "manifesto.json", { cache: "no-store" })).json();
      var s = document.createElement("section");
      var cls = man.stato === "provvisorio" ? "provvisorio" : man.stato === "ufficiale" ? "ufficiale" : "altro";
      s.innerHTML = "<h2>" + esc(man.categoria) + " · GP " + esc(man.gp_nome) + (man.round ? " · R" + man.round : "")
        + '<span class="bollo ' + cls + '">' + esc(String(man.stato).toUpperCase()) + "</span></h2>"
        + '<div class="riga"></div>'
        + '<p class="sc">gara ' + man.gara_id + " · " + man.voci.length + " immagini"
        + (man.saltate.length ? " · " + man.saltate.length + " senza dati" : "") + "</p>";
      var r = s.querySelector(".riga");
      man.voci.forEach(function (v) {
        var a = document.createElement("a");
        var q = "?v=" + man.impronta_dati;
        a.href = g.cartella + v.file + q;
        a.innerHTML = '<img loading="lazy" src="' + g.cartella + v.miniatura + q + '" alt=""><span>' + esc(v.codice + " " + (v.titolo || "")) + "</span>";
        a.onclick = function (ev) {
          ev.preventDefault();
          document.getElementById("di").src = a.href;
          document.getElementById("dm").textContent = v.larghezza + "×" + v.altezza + " · " + Math.round(v.byte / 1024) + " KB · didascalia " + v.didascalia_origine;
          document.getElementById("dt").textContent = v.didascalia || "— nessuna didascalia —";
          document.getElementById("dl").href = a.href;
          document.getElementById("copia").onclick = function () { navigator.clipboard && navigator.clipboard.writeText(v.didascalia || ""); };
          document.getElementById("d").showModal();
        };
        r.appendChild(a);
      });
      m.appendChild(s);
    }
  } catch (e) { info.textContent = "Errore: " + e.message; }
})();
</script></body></html>
